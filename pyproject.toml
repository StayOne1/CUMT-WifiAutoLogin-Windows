[project]
name = "cumt-campus-login"
version = "1.3.0"
description = "CUMT 校园网自动登录 — Windows 托盘版"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
]

[tool.uv]
# 仅在本机使用，无分发包，构建时只需锁文件
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
